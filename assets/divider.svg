<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 12" fill="none" role="presentation" aria-hidden="true" preserveAspectRatio="none">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="78%"  stop-color="#ff0080" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect x="0" y="5" width="800" height="2" rx="1" fill="url(#dl)" filter="url(#dg)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="5" width="800" height="2" rx="1" fill="url(#dl)"/>
</svg>
