<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 600 220" fill="none" role="img" aria-label="n8">
  <defs>
    <!-- .NET purple -> azure blue, animated shimmer -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#512BD4;#2563EB;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#512BD4">
        <animate attributeName="stop-color" values="#512BD4;#2563EB;#06B6D4;#512BD4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#7C3AED;#2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <!-- soft glow behind the wordmark -->
  <text x="50%" y="50%" dy="0.34em" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800"
        font-size="210" letter-spacing="-6" fill="url(#g)" opacity="0.35" filter="url(#soft)">n8</text>

  <!-- crisp wordmark -->
  <text x="50%" y="50%" dy="0.34em" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800"
        font-size="210" letter-spacing="-6" fill="url(#g)">n8</text>
</svg>
